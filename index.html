<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=SUSE:wght@100..800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <title>Formulario de Inscrição</title>
</head>

<body>
    <main>
        <div class="container">
            <h1>CADASTRO</h1>


            <form action="" class="form" method="get">
                <label for="">Nome</label>
                <input type="text" id="nome" name="nome" required>
                <label for="">Email</label>
                <input type="text" id="email" name="email" required>
                <label for="">Telefone</label>
                <input type="text" id="Telefone" name="telefone" required> <br><br>
               
                <label for="">CEP</label>
                <input type="text" id="cep" name="cep" required onblur="Coletar()"> <br> <br>
                <label for="">Cidade</label>
                <input type="text" id="cidade" name="cidade" disabled>
                <label for="">Bairro</label>
                <input type="text" id="bairro" name="bairro" disabled>
                <label for="">Endereço</label>
                <input type="text" id="endereco" name="endereco" disabled> <br><br>
    
                
            </form>
        </div>
    </main>
    <script src="main.js"></script>
</body>
</html>
